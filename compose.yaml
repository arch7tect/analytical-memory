services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: analytical_memory
      POSTGRES_PASSWORD: analytical_memory_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytical_memory"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:54329:5432"
