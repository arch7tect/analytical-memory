[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analytical-memory"
dynamic = ["version"]
description = "Evidence-backed local-first analytical memory"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Analytical Memory contributors" }]
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=2.1.1,<3",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
memory = "analytical_memory.cli:main"
memory-mcp = "analytical_memory.mcp_server:main"
memory-quickstart = "analytical_memory.quickstart:main"

[dependency-groups]
dev = [
  "anyio>=4.14,<5",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analytical_memory"]

[tool.hatch.build.targets.sdist]
exclude = ["/.kimi-code", "**/.DS_Store"]

[tool.hatch.version]
path = "src/analytical_memory/version.py"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
