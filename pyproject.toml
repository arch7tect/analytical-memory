[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analytical-memory"
version = "0.1.0"
description = "Evidence-backed local-first analytical memory"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Analytical Memory contributors" }]
dependencies = []

[project.scripts]
memory = "analytical_memory.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analytical_memory"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
