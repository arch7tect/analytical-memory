name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: analytical_memory
          POSTGRES_PASSWORD: analytical_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d analytical_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ANALYTICAL_MEMORY_TEST_POSTGRES_URL: postgresql://postgres:analytical_memory_test@127.0.0.1:5432/analytical_memory
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-groups --extra postgres --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run python scripts/compile_schema.py --check
      - run: uv run python scripts/compile_query_ir_contract.py --check
      - run: uv run python scripts/smoke.py
      - run: uv run python scripts/benchmark.py --check
      - run: uv run memory-quickstart
      - run: uv run python scripts/mcp_smoke.py
      - run: uv run python scripts/verify_distribution.py

  plugin-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv run --locked python scripts/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: analytical-memory-plugin-bundles
          path: dist/plugins
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: analytical-memory-release-candidate
          path: dist/release/*
          if-no-files-found: error
